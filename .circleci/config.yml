version: 2.1 # Versi konfigurasi CircleCI yang digunakan

executors: # Definisi lingkungan eksekusi yang dapat digunakan kembali
  docker-executor: # Nama executor untuk Docker umum
    docker: # Menggunakan executor Docker
      - image: cimg/base:stable # Image dasar Linux yang stabil
  go-executor: # Nama executor khusus untuk Golang
    docker: # Menggunakan executor Docker
      - image: cimg/go:1.15 # Image Golang versi 1.15

jobs: # Daftar pekerjaan (jobs) yang akan dijalankan
  lint-dockerfile: # Job pertama: Memeriksa kualitas Dockerfile
    executor: docker-executor # Menggunakan executor docker-executor
    steps: # Langkah-langkah dalam job ini
      - checkout # Mengambil kode sumber dari repositori
      - run: # Menjalankan perintah shell
          name: Install hadolint # Nama langkah: Instalasi hadolint
          command: | # Blok perintah multi-line
            sudo curl -L https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 -o /usr/local/bin/hadolint # Mengunduh binary hadolint
            sudo chmod +x /usr/local/bin/hadolint # Memberikan izin eksekusi ke hadolint
      - run: # Menjalankan perintah shell
          name: Run hadolint # Nama langkah: Menjalankan hadolint
          command: hadolint Dockerfile # Memeriksa file Dockerfile dengan hadolint

  test-app: # Job kedua: Menjalankan unit test aplikasi
    executor: go-executor # Menggunakan executor go-executor
    steps: # Langkah-langkah dalam job ini
      - checkout # Mengambil kode sumber dari repositori
      - run: # Menjalankan perintah shell
          name: Run unit tests # Nama langkah: Menjalankan unit tests
          command: go test -v -short --count=1 $(go list ./...) # Perintah untuk menjalankan test Go

  build-app-karsajobs: # Job ketiga: Membangun dan push image Docker
    executor: docker-executor # Menggunakan executor docker-executor
    steps: # Langkah-langkah dalam job ini
      - checkout # Mengambil kode sumber dari repositori
      - setup_remote_docker # Menyiapkan lingkungan Docker remote untuk build image
      - run: # Menjalankan perintah shell
          name: Build and Push Docker image # Nama langkah: Build dan Push image
          command: | # Blok perintah multi-line
            chmod +x build_push_image_karsajobs.sh # Memberikan izin eksekusi ke script
            ./build_push_image_karsajobs.sh # Menjalankan script build dan push

workflows: # Definisi alur kerja (pipeline)
  karsajobs-workflow: # Nama workflow
    jobs: # Daftar job yang akan dijalankan dalam workflow ini
      - lint-dockerfile # Menjalankan job lint-dockerfile
      - test-app # Menjalankan job test-app
      - build-app-karsajobs: # Menjalankan job build-app-karsajobs
          requires: # Menentukan dependensi (syarat) job ini
            - lint-dockerfile # Harus sukses menjalankan lint-dockerfile dulu
            - test-app # Harus sukses menjalankan test-app dulu
          filters: # Filter untuk menentukan kapan job ini berjalan
            branches: # Filter berdasarkan branch
              only: karsajobs # Hanya berjalan jika push ke branch 'karsajobs'
